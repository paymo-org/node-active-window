name: Deploy

on:
  pull_request:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-*'      # v1.2.3-beta, v1.2.3-rc.1

permissions:
  contents: write
  id-token: write

concurrency:
  group: node-active-window-deploy
  cancel-in-progress: false

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  build-addon:
    name: Build addon (${{ matrix.name }})
    needs: [static-analysis]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
          - name: macos-x64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-latest
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
        if: runner.os == 'Linux'
      - run: npm ci
      - name: Prebuild binary
        shell: bash
        run: npm run prebuildify
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.name }}
          path: prebuilds/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build-addon]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:ts
      - uses: actions/download-artifact@v8
        with:
          path: prebuilds
          merge-multiple: true
      - name: Publish to npm
        run: npm publish --provenance --access public
      - name: Extract changelog for this tag
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --abbrev=0 --tags "${TAG}^")"
          {
            echo 'body<<__CHANGELOG_EOF__'
            git diff -U0 "$PREV_TAG" "$TAG" -- CHANGELOG.md \
              | grep -E '^\+' \
              | grep -vE '^\+\+\+' \
              | grep -vE '^\+#+ \[' \
              | sed 's/^\+//'
            echo '__CHANGELOG_EOF__'
          } >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
